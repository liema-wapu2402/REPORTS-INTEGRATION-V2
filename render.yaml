services:
  - type: web
    name: reports-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - { key: APP_NAME, value: Report Integrations }
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_KEY, sync: false } # php artisan key:generate --show
      - { key: APP_URL, sync: false } # https://reports-api.onrender.com
      - { key: FRONTEND_URL, sync: false } # https://your-app.vercel.app (comma-separate for more)
      - { key: LOG_CHANNEL, value: stderr }
      - { key: SESSION_DRIVER, value: array }
      - { key: CACHE_STORE, value: file }
      - { key: QUEUE_CONNECTION, value: sync }
      - { key: WKHTMLTOPDF_BINARY, value: /usr/bin/wkhtmltopdf }
      - { key: NODE_BINARY_PATH, value: /usr/bin/node }
      - { key: NPM_BINARY_PATH, value: /usr/bin/npm }
      - { key: CHROME_PATH, value: /usr/bin/chromium }
      # Free tier has no disk: SQLite file + generated reports reset on every restart/redeploy.
      - { key: DB_CONNECTION, value: sqlite }
      - { key: DB_DATABASE, value: /app/database/database.sqlite }
